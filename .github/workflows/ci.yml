name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Kept in step with .python-version so local and CI agree.
          python-version-file: '.python-version'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned toolchain. `pip install ruff mypy` was unpinned, so an
          # upstream release could turn the lint gate red with no change here.
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Format check (ruff)
        run: ruff format --check src tests scripts

      - name: Typecheck (mypy)
        run: mypy --pretty

      - name: Tests (pytest)
        run: pytest -q

      - name: Docker build
        run: docker build -t intradyne-lite:ci .

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      



