name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # The three durable stores run on either SQLite or Postgres depending on
      # DB_URL, and the compose stack uses Postgres. Without a database here
      # the Postgres half of tests/test_db_backends.py skips, so the only
      # coverage of the deployed backend would be the dialect logic -- the
      # stores themselves would go untested on the engine they actually run on.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intradyne
          POSTGRES_USER: intradyne
          POSTGRES_PASSWORD: intradyne
          # Matches the deployment, and it is load-bearing for the test that
          # daily closes bucket by UTC. Postgres defaults to UTC, which would
          # make that assertion pass no matter what the day expression did;
          # against Asia/Kuching a server-local bucket is eight hours out and
          # the test fails, which is the whole point of having it.
          TZ: Asia/Kuching
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intradyne -d intradyne"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Kept in step with .python-version so local and CI agree.
          python-version-file: '.python-version'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned toolchain. `pip install ruff mypy` was unpinned, so an
          # upstream release could turn the lint gate red with no change here.
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Format check (ruff)
        run: ruff format --check src tests scripts

      - name: Typecheck (mypy)
        run: mypy --pretty

      - name: Tests (pytest)
        # TEST_POSTGRES_URL is what un-skips the Postgres store tests. If it is
        # unset or wrong they skip and the suite still exits 0, so
        # test_ci_runs_the_postgres_suite fails on a skip whenever CI is set --
        # a green gate that never ran the backend is worse than no gate.
        env:
          TEST_POSTGRES_URL: postgresql://intradyne:intradyne@localhost:5432/intradyne
        run: pytest -q

      - name: Docker build
        run: docker build -t intradyne-lite:ci .

      # Building the image proves it builds, not that it serves anything. The
      # dashboard ships inside the Python package and the research record is
      # copied in separately, so a Dockerfile that misses a path yields a
      # perfectly healthy API serving a 404 for every page -- which is exactly
      # what happened before these COPY lines existed.
      - name: Smoke test the image
        run: |
          docker run -d --name intradyne-ci -p 8000:8000 \
            -e API_AUTH_REQUIRED=0 \
            -e ENGINE_ENABLED=false \
            -e APP_ENV=development \
            -e DB_URL=sqlite:////app/state/trades.sqlite \
            -e EXPLAIN_LEDGER_PATH=/app/data/explainability_ledger.jsonl \
            intradyne-lite:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz > /dev/null && break
            sleep 2
          done
          API_BASE=http://localhost:8000 python scripts/e2e_smoke.py

      - name: Container logs (on failure)
        if: failure()
        run: docker logs intradyne-ci || true

      - name: Stop the smoke container
        if: always()
        run: docker rm -f intradyne-ci || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # checkout defaults to a depth of 1. Gitleaks cannot walk history in
          # a shallow clone, so it silently fell back to scanning the working
          # directory -- meaning this job has only ever looked at the tip
          # commit, and a credential committed and then removed would have
          # sailed through. It also changes the fingerprint format, so
          # .gitleaksignore entries never matched.
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      



