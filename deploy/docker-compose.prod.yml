
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: intradyne-lite:1.9.0
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app/src
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RATE_LIMIT_REQS=${RATE_LIMIT_REQS:-120}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      # The container root is read_only; only /app/data, /app/reports and /tmp
      # are writable. The ledger default (a bare relative filename -> /app) is
      # unwritable here and fails on the first guardrail append.
      - EXPLAIN_LEDGER_PATH=${EXPLAIN_LEDGER_PATH:-/app/data/explainability_ledger.jsonl}
      # Postgres, in the service below. Set DB_URL explicitly to
      # sqlite:////app/data/trades.sqlite to go back; nothing else has to
      # change, and the ../data mount that held it is still here.
      - DB_URL=${DB_URL:-postgresql://${POSTGRES_USER:-intradyne}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-intradyne}}
      # Required in production: the app refuses to boot with a '*'
      # origin list, and with auth enforced but no key configured.
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:?set an explicit origin list}
      - X_API_KEY=${X_API_KEY:?set an API key}
    command: uvicorn intradyne.api.app:app --host 0.0.0.0 --port 8000
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [web]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-intradyne}
      - POSTGRES_USER=${POSTGRES_USER:-intradyne}
      # No default here, unlike the base compose file. This stack is the
      # one that gets a public hostname and a TLS certificate, and the
      # same :? guard is already what stops it booting with a wildcard
      # CORS list or no API key.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a database password}
      - TZ=Asia/Kuching
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published. Only the api service and caddy are on this network,
    # and only caddy has a ports: entry.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intradyne} -d ${POSTGRES_DB:-intradyne}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    networks: [web]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - ACME_AGREE=true
      - CADDY_EMAIL=${CADDY_EMAIL}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks: [web]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-alerts:/etc/prometheus/alerts:ro
    networks: [web]

  grafana:
    image: grafana/grafana:11.1.4
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.example.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER:-user}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-pass}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-alerts@example.com}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-Intradyne Grafana}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [web]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

networks:
  web: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
