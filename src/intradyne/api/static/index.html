<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intradyne</title>
<!-- Telegram's Mini App bridge. `defer` is deliberate: this is the only
     external resource on the page, and without it a blocking <script> in the
     head stalls rendering whenever telegram.org is slow or unreachable -- on
     localhost, where the bridge is not needed at all, and on the flaky
     connections this system is expected to run over. The page authenticates
     without it either way; see initDataFromHash below. -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #21262d;
    --fg: #e6edf3; --dim: #8b949e; --faint: #6e7681;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  .spacer { flex: 1; }
  .pill {
    font: 500 11px/1 var(--mono); padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .pill.ok   { color: var(--ok);   border-color: #23863644; background: #23863618; }
  .pill.warn { color: var(--warn); border-color: #d2992244; background: #d2992218; }
  .pill.bad  { color: var(--bad);  border-color: #f8514944; background: #f8514918; }

  main {
    display: grid; gap: 14px; padding: 18px; max-width: 1180px; margin: 0 auto;
    /* min() is load-bearing: a bare minmax(330px, 1fr) forces every column to
       330px even when the viewport is narrower, so the page scrolls
       sideways on a phone. This is the width a Telegram Mini App runs at. */
    grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr));
  }
  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; min-width: 0;
  }
  section.wide { grid-column: 1 / -1; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 0 0 12px; font-weight: 600;
  }
  .row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 0; border-bottom: 1px solid #21262d80;
  }
  .row:last-child { border-bottom: 0; }
  .k { color: var(--dim); }
  .v { font-family: var(--mono); text-align: right; word-break: break-all; }
  .v.ok { color: var(--ok); } .v.warn { color: var(--warn); } .v.bad { color: var(--bad); }

  /* A threshold bar makes "how close to the limit" readable at a glance,
     which a bare number does not. */
  .meter { height: 4px; background: #21262d; border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--ok); transition: width .3s, background .3s; }
  .meter.warn > i { background: var(--warn); }
  .meter.bad  > i { background: var(--bad); }

  .banner {
    grid-column: 1 / -1; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #d2992244; background: #d2992214; color: var(--warn);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .banner.bad { border-color: #f8514944; background: #f8514914; color: var(--bad); }
  .banner b { font-weight: 600; }
  .banner p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }

  /* Controls.
     Stop is styled to be found in a hurry and start is not, because the two
     directions are not equally safe: halting a system that is fine costs a
     few idle minutes, and resuming one that should be stopped costs money. */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    font: 600 13px/1 inherit; padding: 11px 16px; border-radius: 8px;
    border: 1px solid var(--line); background: #21262d; color: var(--fg);
    cursor: pointer; min-height: 44px; flex: 1 1 auto;
  }
  button:hover:not(:disabled) { border-color: var(--faint); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.stop {
    background: #f8514918; border-color: #f8514966; color: var(--bad);
    flex-basis: 100%; font-size: 14px;
  }
  button.go { background: #23863618; border-color: #23863666; color: var(--ok); }
  .hint { color: var(--faint); font-size: 12px; margin: 10px 0 0; }
  #actionlog {
    margin-top: 10px; font-family: var(--mono); font-size: 12px;
    color: var(--dim); word-break: break-word;
  }
  #actionlog.bad { color: var(--bad); } #actionlog.ok { color: var(--ok); }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  th {
    text-align: left; color: var(--faint); font-weight: 500; padding: 4px 8px 8px 0;
    text-transform: uppercase; letter-spacing: .06em; font-size: 10px;
  }
  td { padding: 5px 8px 5px 0; border-top: 1px solid #21262d80; vertical-align: top; }
  td.num { text-align: right; }
  .empty { color: var(--faint); font-style: italic; padding: 10px 0; }
  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 4px 0 24px; }
  @media (max-width: 560px) { main { padding: 12px; gap: 12px; } header { padding: 12px; } }
</style>
</head>
<body>
<header>
  <h1>Intradyne</h1>
  <span class="pill" id="p-version">—</span>
  <span class="pill" id="p-mode">—</span>
  <span class="pill" id="p-engine">—</span>
  <span class="spacer"></span>
  <span class="pill" id="p-user" hidden></span>
  <span class="pill" id="p-conn">connecting</span>
</header>

<main id="main">
  <div class="banner" id="gate" hidden></div>

  <section class="wide">
    <h2>Controls</h2>
    <div class="controls" id="controls"></div>
    <div id="actionlog"></div>
  </section>

  <section>
    <h2>Engine</h2>
    <div id="engine"></div>
  </section>

  <section>
    <h2>Risk</h2>
    <div id="risk"></div>
  </section>

  <section>
    <h2>Portfolio</h2>
    <div id="portfolio"></div>
  </section>

  <section>
    <h2>Health</h2>
    <div id="health"></div>
  </section>

  <section class="wide">
    <h2>Ledger — most recent events</h2>
    <div id="ledger"></div>
  </section>
</main>

<footer id="foot"></footer>

<script type="module">
const $ = (id) => document.getElementById(id);

// Two ways in, and the page holds no credential of its own either way.
//
// Inside Telegram, `initData` is a string Telegram signed with the bot's
// credential. The page forwards it and the server verifies the signature, so
// nothing confidential is ever present in JavaScript a reader could lift.
// Outside Telegram the page falls back to a key supplied in the query string
// by whoever opened it -- acceptable on localhost, which is the only place
// that path is meant to be used.
const TG = window.Telegram && window.Telegram.WebApp;

// The bridge defines window.Telegram wherever it loads, so its mere presence
// proves nothing. It reports platform "unknown" outside Telegram. Today that
// also leaves themeParams empty, which makes the theming below inert by
// accident; this makes it inert on purpose, so a future bridge shipping light
// defaults cannot repaint the localhost dashboard into unreadability.
const IN_TELEGRAM = !!(TG && TG.platform && TG.platform !== "unknown");

/** Read initData straight out of the URL, without the bridge.
 *
 * Telegram puts the signed payload in the fragment as `tgWebAppData` -- it is
 * where the bridge itself reads it from. Parsing it here means authentication
 * does not depend on a remote script having loaded, so a failed or blocked
 * telegram.org leaves the dashboard working with only the theming lost.
 */
function initDataFromHash() {
  try {
    return new URLSearchParams(location.hash.slice(1)).get("tgWebAppData") || "";
  } catch (_) {
    return "";
  }
}

const INIT = (TG && TG.initData) || initDataFromHash();
const KEY = new URLSearchParams(location.search).get("key") || "";
const headers = INIT
  ? { "X-Telegram-Init-Data": INIT }
  : (KEY ? { "X-API-Key": KEY } : {});

async function get(path) {
  const r = await fetch(path, { headers });
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}

const fmt = {
  num: (v, d = 2) => (v === null || v === undefined || Number.isNaN(v))
    ? "—" : Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }),
  pct: (v, d = 2) => (v === null || v === undefined) ? "—" : `${(Number(v) * 100).toFixed(d)}%`,
  time: (t) => {
    if (!t) return "—";
    const n = Number(t);
    const ms = Number.isFinite(n) ? (n > 1e12 ? n : n * 1000) : Date.parse(t);
    return Number.isFinite(ms) ? new Date(ms).toLocaleString() : String(t);
  },
};

function rows(el, items) {
  el.innerHTML = items.map(([k, v, cls]) =>
    `<div class="row"><span class="k">${k}</span><span class="v ${cls || ""}">${v}</span></div>`
  ).join("");
}

/** A value against its limit, shown as a bar. Colour follows proximity. */
function meter(label, value, limit) {
  const frac = limit > 0 ? Math.min(Number(value) / limit, 1) : 0;
  const cls = frac >= 1 ? "bad" : frac >= 0.66 ? "warn" : "";
  return `<div class="row" style="display:block">
    <div style="display:flex;justify-content:space-between">
      <span class="k">${label}</span>
      <span class="v ${cls}">${fmt.pct(value)} <span style="color:var(--faint)">/ ${fmt.pct(limit)}</span></span>
    </div>
    <div class="meter ${cls}"><i style="width:${(frac * 100).toFixed(1)}%"></i></div>
  </div>`;
}

function setPill(el, text, cls) {
  el.textContent = text;
  el.className = "pill" + (cls ? " " + cls : "");
}

/** Repaint in the host's colours when running inside Telegram.
 *
 * The dashboard is dark by default. Telegram users choose their own theme, and
 * a light-theme user would otherwise get this page's near-white text on their
 * near-white background -- unreadable, and invisible to anyone testing on a
 * dark phone. Mapping the host palette onto the same CSS variables keeps one
 * stylesheet for both.
 */
function adoptTelegramTheme() {
  if (!IN_TELEGRAM) return;
  TG.ready();
  TG.expand();
  const t = TG.themeParams || {};
  const set = (k, v) => v && document.documentElement.style.setProperty(k, v);
  set("--bg", t.bg_color);
  set("--panel", t.secondary_bg_color || t.bg_color);
  set("--fg", t.text_color);
  set("--dim", t.hint_color);
  set("--faint", t.hint_color);
  set("--accent", t.link_color);
  set("--line", t.section_separator_color || t.hint_color);
  set("--bad", t.destructive_text_color);
  // Telegram paints its own chrome above the page; matching it stops a band of
  // the wrong colour sitting across the top.
  try { TG.setHeaderColor(t.secondary_bg_color || t.bg_color); } catch (_) {}
  try { TG.setBackgroundColor(t.bg_color); } catch (_) {}
}

adoptTelegramTheme();
if (IN_TELEGRAM) TG.onEvent("themeChanged", adoptTelegramTheme);

/** Ask before doing anything that changes the system.
 *
 * Telegram's native dialog inside the Mini App, window.confirm outside. Both
 * are deliberately modal: every button in the Controls panel changes live
 * state, and a mis-tap on a phone is easy.
 */
function confirmAction(message) {
  if (IN_TELEGRAM && TG.showConfirm) {
    return new Promise((resolve) => TG.showConfirm(message, resolve));
  }
  return Promise.resolve(window.confirm(message));
}

function say(text, cls) {
  const el = $("actionlog");
  el.textContent = text;
  el.className = cls || "";
}

let busy = false;

/** Run one control action: confirm, disable the panel, POST, report, refresh.
 *
 * The panel is disabled for the whole round trip. Without it a slow request
 * invites a second tap, and two halts are harmless but two applies are not.
 */
async function act(label, message, path, opts) {
  if (busy) return;
  if (!(await confirmAction(message))) return;
  busy = true;
  document.querySelectorAll("#controls button").forEach((b) => (b.disabled = true));
  say(label + "...", "");
  try {
    const r = await fetch(path, { method: "POST", headers, ...(opts || {}) });
    const body = await r.text();
    if (!r.ok) {
      // 401 here is worth calling out: the page loaded, so the credential was
      // good enough to read. Being refused on a write means the deployment
      // wants a second one that a browser cannot hold.
      say(
        r.status === 401
          ? "Refused (401). This deployment requires a separate admin credential, which cannot be sent from a browser -- halt from the command line instead."
          : `${label} failed: ${r.status} ${body.slice(0, 120)}`,
        "bad"
      );
    } else {
      say(`${label}: ${body.slice(0, 160)}`, "ok");
      if (IN_TELEGRAM && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success");
    }
  } catch (err) {
    say(`${label} failed: ${err.message || err}`, "bad");
  } finally {
    busy = false;
    // Re-enable here rather than relying on the refresh below to redraw them.
    // A redraw only happens when the halt direction changed, so after Apply --
    // which does not change it -- the panel would have stayed dead.
    document.querySelectorAll("#controls button").forEach((b) => (b.disabled = false));
    await refresh();
  }
}

/** Draw the controls for the current state.
 *
 * Halt and Resume are never both offered: one switch, one direction at a
 * time, so there is nothing to misread under pressure.
 */
function renderControls(halted) {
  const el = $("controls");
  el.innerHTML = halted
    ? `<button class="go" id="c-resume">Resume trading</button>`
    : `<button class="stop" id="c-halt">Halt trading now</button>`;
  el.insertAdjacentHTML(
    "beforeend",
    `<button id="c-apply">Apply params</button><button id="c-revert">Revert params</button>`
  );

  if (halted) {
    $("c-resume").onclick = () =>
      act(
        "Resume",
        "Resume trading?\n\nThe engine will be allowed to place orders again. Only do this if you know why it was halted.",
        "/admin/halt",
        { headers: { ...headers, "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: false }) }
      );
  } else {
    // Halting is the safe direction, so this confirmation is a formality
    // against mis-taps rather than a warning.
    $("c-halt").onclick = () =>
      act(
        "Halt",
        "Halt trading?\n\nNo further orders will be placed until you resume.",
        "/admin/halt",
        { headers: { ...headers, "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: true }) }
      );
  }
  $("c-apply").onclick = () =>
    act(
      "Apply",
      "Apply production_params.json to the running engine?\n\nThe current configuration is kept so you can revert once.",
      "/engine/params/apply"
    );
  $("c-revert").onclick = () =>
    act(
      "Revert",
      "Restore the configuration from before the last apply?",
      "/engine/params/revert"
    );
}

async function refresh() {
  try {
    const [health, ready, engine, portfolio, risk, ledger] = await Promise.all([
      get("/healthz"), get("/readyz"), get("/engine/status"),
      get("/portfolio"), get("/risk/status"), get("/ledger/tail").catch(() => []),
    ]);
    setPill($("p-conn"), "live", "ok");
    // Whose session this is. Worth showing: the allowlist is the only thing
    // between this page and the open internet, so a name that is not yours is
    // the signal that something is wrong.
    const who = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
    if (who) {
      $("p-user").hidden = false;
      setPill($("p-user"), who.username ? "@" + who.username : "id " + who.id);
    }

    // -- header ---------------------------------------------------------
    setPill($("p-version"), health.version || "—");
    // Only say LIVE when it is actually live. Appending the paper state to a
    // mode that already reads "paper" produced "paper · paper".
    setPill($("p-mode"), engine.live_trading_enabled ? "LIVE TRADING" : (engine.mode || "?"),
            engine.live_trading_enabled ? "bad" : "");
    setPill($("p-engine"), engine.running ? "running" : engine.enabled ? "starting" : "stopped",
            engine.running ? "ok" : engine.enabled ? "warn" : "");

    // -- why it is not trading -------------------------------------------
    // The most important thing on the page. A user should never have to
    // wonder why nothing is happening.
    const gate = $("gate");
    if (risk.halted) {
      gate.hidden = false;
      gate.className = "banner bad";
      gate.innerHTML = `<div><b>Trading halted</b><p>${risk.halt_reason || "no reason recorded"}</p></div>`;
    } else if (!engine.enabled) {
      gate.hidden = false;
      gate.className = "banner";
      gate.innerHTML = `<div><b>Engine not running</b><p>ENGINE_ENABLED is false, or the
        strategy gate is shut because no edge has been demonstrated. See RUNBOOK.md.</p></div>`;
    } else {
      gate.hidden = true;
    }
    // Redrawing every poll would destroy a button mid-tap, so rebuild only
    // when the direction of the switch changed -- or on the first paint.
    const halted = !!risk.halted;
    if (renderControls.last !== halted || !$("controls").children.length) {
      renderControls(halted);
      renderControls.last = halted;
    }

    // -- panels -----------------------------------------------------------
    rows($("engine"), [
      ["enabled", engine.enabled ? "yes" : "no", engine.enabled ? "ok" : ""],
      ["running", engine.running ? "yes" : "no", engine.running ? "ok" : ""],
      ["mode", engine.mode || "—"],
      ["live trading", engine.live_trading_enabled ? "ENABLED" : "disabled",
        engine.live_trading_enabled ? "bad" : "ok"],
      ["symbols", (engine.symbols || []).length ? engine.symbols.join(", ") : "—"],
      ["open positions", Object.keys(engine.open_positions || {}).length],
    ]);

    const th = risk.thresholds || {};
    $("risk").innerHTML =
      meter("30d drawdown", risk.dd_30d || 0, th.dd_halt || 0.2) +
      meter("1d VaR", risk.var_1d || 0, th.var_max || 0.05) +
      `<div class="row"><span class="k">breaches (24h)</span>
        <span class="v ${(risk.breaches_24h || 0) >= (th.kill_switch || 3) ? "bad"
          : (risk.breaches_24h || 0) > 0 ? "warn" : ""}">
        ${risk.breaches_24h || 0} <span style="color:var(--faint)">/ ${th.kill_switch ?? "—"}</span></span></div>` +
      `<div class="row"><span class="k">halted</span>
        <span class="v ${risk.halted ? "bad" : "ok"}">${risk.halted ? "yes" : "no"}</span></div>` +
      `<div class="row"><span class="k">equity points (30d)</span>
        <span class="v">${risk.equity?.points_30d ?? 0}</span></div>`;

    const bal = portfolio.balances || {};
    const pos = portfolio.positions || {};
    rows($("portfolio"), [
      ...Object.entries(bal).map(([k, v]) => [k, fmt.num(v)]),
      ["positions", Object.keys(pos).length || "none"],
      ...Object.entries(pos).map(([k, p]) => [
        k, `${fmt.num(p.base, 6)} @ ${fmt.num(p.avg_price)}`]),
    ]);

    rows($("health"), [
      ["api", health.status || "—", health.status === "ok" ? "ok" : "bad"],
      ["ready", ready.ready ? "yes" : "no", ready.ready ? "ok" : "bad"],
      ...Object.entries(ready.components || {}).map(
        ([k, v]) => [k, v ? "ok" : "down", v ? "ok" : "bad"]),
      ["build", health.build || "—"],
    ]);

    const evs = Array.isArray(ledger) ? ledger.slice(-25).reverse() : [];
    $("ledger").innerHTML = evs.length
      ? `<div style="overflow-x:auto"><table>
          <tr><th>time</th><th>event</th><th>symbol</th><th class="num">qty</th><th class="num">px</th></tr>
          ${evs.map(e => `<tr>
            <td>${fmt.time(e.ts)}</td>
            <td>${e.event || "—"}</td>
            <td>${e.symbol || "—"}</td>
            <td class="num">${e.qty != null ? fmt.num(e.qty, 6) : "—"}</td>
            <td class="num">${e.px != null ? fmt.num(e.px) : "—"}</td>
          </tr>`).join("")}
        </table></div>`
      : `<div class="empty">No events yet — the ledger is written when the engine trades.</div>`;

    $("foot").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (err) {
    // A failed poll must not blank the page: stale numbers with a clear
    // "stale" marker are more useful than an empty dashboard.
    setPill($("p-conn"), String(err.message || err).slice(0, 40), "bad");
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
