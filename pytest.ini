[pytest]
addopts = -q
# Collect only our own tests. Without this, a bare `pytest` walks the whole
# tree including gitignored directories: vendor/ holds three cloned upstream
# repos carrying ~350 test files, one of which calls sys.exit(0) at import
# and takes the run down with an INTERNALERROR before a single test runs.
testpaths = tests
norecursedirs = @* _prev intradyne_lite vendor .venv .claude
pythonpath = .
    src
