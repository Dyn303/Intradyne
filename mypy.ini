[mypy]
python_version = 3.11
warn_unused_ignores = True
no_implicit_optional = True
ignore_missing_imports = True

# Allow running `mypy src` while focusing on the typed core.
# Exclude legacy/shim modules that are intentionally dynamic.
exclude = ^(@.*|_prev/|src/intradyne/engine/|src/intradyne/strategies/)

# You can run `mypy` without args; default to core engine/backtester.
files = src/intradyne
mypy_path = src
explicit_package_bases = True

[mypy-intradyne.core.config]
ignore_errors = True
