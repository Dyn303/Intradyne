[mypy]
python_version = 3.11
warn_unused_ignores = True
no_implicit_optional = True
ignore_missing_imports = True
mypy_path = src
explicit_package_bases = True

# Everything under src/intradyne is checked, engine included. Quote values
# arriving from a feed or a CSV are typed Mapping[str, Any] at the boundary
# and narrowed immediately, which is what made the engine checkable without
# pretending its inputs are structured when they are not.
files = src/intradyne
exclude = ^(_prev/)

# Third-party stubs must not be able to break our gate. numpy ships stubs
# using syntax newer than our target Python, so following them made the
# typecheck fail on the *library version installed*, not on our code.
[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-pandas.*]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-ccxt.*]
follow_imports = skip

# redis is an optional runtime dependency -- the rate limiter falls back to an
# in-memory window when it is absent, so it is deliberately not in
# requirements.txt. mypy knows a `types-redis` stub package exists and reports
# `import-untyped`, which the global ignore_missing_imports does not suppress,
# so CI failed on a package that is intentionally not installed.
[mypy-redis.*]
ignore_missing_imports = True
