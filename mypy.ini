[mypy]
python_version = 3.11
warn_unused_ignores = True
no_implicit_optional = True
ignore_missing_imports = True
mypy_path = src
explicit_package_bases = True

# The API, risk, core and backtester layers are typechecked. The engine is
# excluded for now -- see the note at the bottom.
files = src/intradyne
exclude = ^(_prev/|src/intradyne/engine/|src/intradyne/strategies/)

# Third-party stubs must not be able to break our gate. numpy ships stubs
# using syntax newer than our target Python, so following them made the
# typecheck fail on the *library version installed*, not on our code.
[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-pandas.*]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-ccxt.*]
follow_imports = skip

# The engine is not annotated yet. Excluding it from `files` is not enough,
# because the API imports it and mypy follows those imports; skipping them
# keeps the gate scoped to what is actually checked instead of failing on
# code the config says it does not check.
[mypy-intradyne.engine.*]
follow_imports = skip

[mypy-intradyne.strategies.*]
follow_imports = skip

# TODO(phase 4+): drop the engine exclusion above. intradyne/engine/router.py
# is ~615 lines of the actual trading logic and is entirely unchecked; it needs
# annotations before it can be added without a wall of errors.
